name: Build odoc + sherlodoc artifacts

# Per supported OCaml release, build native odoc HTML with client-side sherlodoc
# search plus the .html.json fragment tree ocaml.org consumes, and publish the
# tree as a per-version GitHub release asset. See issue #14; consumer RFC
# ocaml/ocaml.org#3909. The build recipe lives in scripts/build-odoc-sherlodoc.sh.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated OCaml minor versions to build (floor 5.3)"
        default: "5.3 5.4 5.5"
  push:
    branches: [main]
    # Only version directories can change the matrix; the detect job intersects
    # the actual diff with the 5.3 odoc floor, so legacy 4.x edits build nothing.
    paths:
      - "[0-9]*.[0-9]*/**"

# Needed by `gh release` to create/update per-version releases.
permissions:
  contents: write

concurrency:
  group: odoc-sherlodoc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Compute the version matrix: the dispatch input, or (on push) the top-level
  # N.M/ directories that were added or modified, each filtered to >= 5.3.
  detect:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history to diff before..after on push
      - id: set
        shell: bash
        # Event data goes through env, never ${{ }} inside the script, so a
        # crafted dispatch input cannot inject shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSIONS: ${{ github.event.inputs.versions }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # keep $1 iff it is >= 5.3 (the odoc-supported floor)
          floor_ok() { [ "$(printf '%s\n%s\n' "$1" 5.3 | sort -V | head -1)" = "5.3" ]; }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # whitespace-separated input -> one candidate per line
            raw="$(printf '%s' "$INPUT_VERSIONS" | tr ' \t' '\n')"
          else
            before="$BEFORE"
            # github.event.before is zeros / unreachable on first push or force-push.
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before="$(git rev-parse "$AFTER~1" 2>/dev/null || true)"
            fi
            if [ -n "$before" ]; then
              changed="$(git diff --name-only "$before" "$AFTER")"
            else
              changed="$(git show --name-only --pretty=format: "$AFTER")"
            fi
            raw="$(printf '%s\n' "$changed" \
              | grep -E '^[0-9]+\.[0-9]+/' | cut -d/ -f1 | sort -u || true)"
          fi

          selected=()
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            if ! [[ "$m" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "reject '$m': not an N.M OCaml minor version"; continue
            fi
            if floor_ok "$m"; then selected+=("$m")
            else echo "skip $m: below odoc floor 5.3"; fi
          done <<< "$raw"

          if [ "${#selected[@]}" -eq 0 ]; then
            versions='[]'
          else
            versions="$(printf '%s\n' "${selected[@]}" | sort -uV | jq -Rnc '[inputs]')"
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "matrix: $versions"

  build:
    needs: detect
    if: needs.detect.outputs.versions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # a full build takes ~10 min
    strategy:
      fail-fast: false # one version failing must not cancel the others
      matrix:
        version: ${{ fromJSON(needs.detect.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache opam download cache
        uses: actions/cache@v6
        with:
          path: ~/.opam/download-cache
          key: opam-dl-${{ runner.os }}-${{ matrix.version }}

      - name: Install opam
        # Bounded: a slow apt mirror once stalled this step for 20+ min.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          # --no-install-recommends: opam merely Recommends Ubuntu's own OCaml
          # (~130 MB we never use; the switch builds its own compiler).
          sudo apt-get install -y --no-install-recommends opam
          opam init --bare --disable-sandboxing -y

      - name: Build odoc + sherlodoc tree for ${{ matrix.version }}
        env:
          VERSION: ${{ matrix.version }}
        run: scripts/build-odoc-sherlodoc.sh "$VERSION" _out

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ocaml-${{ matrix.version }}-odoc-sherlodoc
          path: |
            ocaml-${{ matrix.version }}-odoc-sherlodoc-html.tar.gz
            ocaml-${{ matrix.version }}-odoc-dill.tar.gz
          retention-days: 14

      - name: Publish to per-version release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          tag="odoc-sherlodoc-$VERSION"
          {
            echo "Auto-generated odoc HTML + client-side sherlodoc search + .html.json fragments for the OCaml $VERSION compiler distribution (stdlib + compiler-libs). Built by .github/workflows/build-odoc-sherlodoc.yml from $GITHUB_SHA; see issue #14."
            echo
            echo "- \`ocaml-$VERSION-odoc-sherlodoc-html.tar.gz\`: standalone odoc site (native HTML + sherlodoc search), one directory per opam package."
            echo "- \`ocaml-$VERSION-odoc-dill.tar.gz\`: the same docs laid out as dill (ocaml-docs-ci) serves a package: \`p/<pkg>/<ver>/status.json\` and \`p/<pkg>/<ver>/doc/{sidebar.json,index.js,**/*.html.json}\`."
            echo
            echo "Toolchain (the .html.json format must match ocaml.org's parser):"
            echo
            echo '```'
            cat "ocaml-$VERSION-toolchain.txt"
            echo '```'
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --title "odoc + sherlodoc docs for OCaml $VERSION" --notes-file notes.md
          fi
          gh release upload "$tag" --clobber \
            "ocaml-$VERSION-odoc-sherlodoc-html.tar.gz" \
            "ocaml-$VERSION-odoc-dill.tar.gz"
